
name: Gerar APK Renato Car Play

on:
  workflow_dispatch:
  push:
    paths:
      - "Renato_Car_Play_projeto_v0.1.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Extrair projeto
        run: |
          unzip -q Renato_Car_Play_projeto_v0.1.zip -d extraido
          test -d extraido/renato_car_play/app
          cp -R extraido/renato_car_play/app ./app
          cp extraido/renato_car_play/build.gradle ./build.gradle
          cp extraido/renato_car_play/settings.gradle ./settings.gradle

      - name: Compilar aplicativo
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Renato-Car-Play-APK
          path: app/build/outputs/apk/debug/app-debug.apk
